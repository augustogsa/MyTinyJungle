openapi: 3.1.0
info:
  title: My Tiny Jungle API
  version: 1.0.0
  license: { name: Proprietary, url: "https://mytinyjungle.com/terms" }
  description: |
    One account across iOS, Android and web. Clients (Swift, Kotlin) are generated from this file.
    Auth: `Authorization: Bearer <accessToken>` (EdDSA JWT, 30 min). Refresh tokens rotate on every use;
    reusing an old one revokes every session of the account.
    Daily limits per user and per device: /v1/brain/scene and /v1/brain/identify 60 (identify-batch: one per crop, shared with identify), /v1/brain/ask 300,
    /v1/diagnose 20. Over the limit: 429 {"error":"daily_limit"} (resets at 00:00 UTC). When the photo models
    are saturated: 503 {"error":"busy"}; retry later.
servers:
  - url: https://api.mytinyjungle.com
security:
  - bearer: []
paths:
  /health:
    get:
      operationId: health
      summary: Health
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /v1/auth/signin:
    post:
      operationId: signIn
      summary: Sign in
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignInRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Refresh
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/signout:
    post:
      operationId: signOut
      summary: Sign out
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /v1/auth/link:
    post:
      operationId: linkProvider
      summary: Link provider
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [provider, idToken], properties: { provider: { $ref: "#/components/schemas/Provider" }, idToken: { type: string } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      operationId: getMe
      summary: Get me
      responses: { "200": { description: Me, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } } }
    patch:
      operationId: updateMe
      summary: Update me
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { displayName: { type: string, maxLength: 60 }, locale: { type: string, maxLength: 12 } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    delete:
      operationId: deleteMe
      summary: Delete me
      description: Signs out everywhere; data is erased after 30 days unless the user signs in again.
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /v1/me/export:
    get:
      operationId: exportMe
      summary: Export me
      description: Everything stored about the caller as one JSON file (GDPR art. 15/20, LGPD art. 18). Photos are listed with their media path.
      responses: { "200": { description: Export, content: { application/json: { schema: { type: object } } } } }
  /v1/content/manifest:
    get:
      operationId: getContentManifest
      summary: Get content manifest
      security: []
      description: Content pack index (logical path to hashed blob). ETag; 304 when unchanged; max-age 300.
      responses:
        "200": { description: Manifest, content: { application/json: { schema: { type: object, required: [version, files], properties: { version: { type: string }, files: { type: object, additionalProperties: { type: object, required: [h, n], properties: { h: { type: string }, n: { type: integer } } } } } } } } }
        "304": { description: Not modified }
  /v1/content/b/{name}:
    get:
      operationId: getContentBlob
      summary: Get content blob
      security: []
      description: Immutable content blob named by its SHA-256 prefix; cached for a year.
      parameters: [{ name: name, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}\\.(json|png|jpg|mov|webp)$" } }]
      responses: { "200": { description: Blob, content: { application/octet-stream: { schema: { type: string, format: binary } } } }, "404": { $ref: "#/components/responses/Error" } }
  /v1/me/push-token:
    put:
      operationId: setPushToken
      summary: Set push token
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, maxLength: 400 } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /v1/attest/challenge:
    post:
      operationId: attestChallenge
      summary: Attest challenge
      description: One-time App Attest challenge for this device, valid 5 minutes.
      responses: { "200": { description: Challenge, content: { application/json: { schema: { type: object, required: [challenge], properties: { challenge: { type: string, format: byte } } } } } } }
  /v1/attest:
    post:
      operationId: attest
      summary: Attest
      description: iOS App Attest attestation; verified against Apple's App Attestation Root CA, then the device is marked attested.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [keyId, attestation], properties: { keyId: { type: string, format: byte }, attestation: { type: string, format: byte } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/Error" } }
  /v1/jungles:
    get:
      operationId: listJungles
      summary: List jungles
      description: Creates the personal jungle on first call.
      responses:
        "200":
          description: Jungles
          content: { application/json: { schema: { type: object, required: [jungles], properties: { jungles: { type: array, items: { $ref: "#/components/schemas/Jungle" } } } } } }
    post:
      operationId: createJungle
      summary: Create jungle
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 60 } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string, format: uuid } } } } } }
  /v1/jungles/{id}:
    delete:
      operationId: deleteJungle
      summary: Delete jungle
      description: Owner ends a shared jungle; members lose access, its records and photos are erased. The personal jungle cannot be deleted.
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/jungles/{id}/house:
    parameters: [{ $ref: "#/components/parameters/JungleID" }]
    get:
      operationId: getHouse
      summary: Get house
      description: Shared-jungle household state (members' turns, cover asks, activity, plant roster), merged on devices.
      responses:
        "200": { description: House, content: { application/json: { schema: { $ref: "#/components/schemas/House" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putHouse
      summary: Put house
      description: Compare-and-swap on version (baseVersion null creates). Success wakes other members' devices (silent APNs / FCM data push).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object }, baseVersion: { type: [integer, "null"], format: int64 } } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, format: int64 } } } } } }
        "409": { description: Stale; merge this copy and retry, content: { application/json: { schema: { $ref: "#/components/schemas/House" } } } }
  /v1/jungles/{id}/invites:
    post:
      operationId: createInvite
      summary: Create invite
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [member, sitter] }, until: { type: string, format: date-time } } } } }
      responses:
        "201": { description: Invite, content: { application/json: { schema: { $ref: "#/components/schemas/Invite" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/invites/{code}/redeem:
    post:
      operationId: redeemInvite
      summary: Redeem invite
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "Joined. The same codes join households (householdId is then set).", content: { application/json: { schema: { type: object, required: [jungleId], properties: { jungleId: { type: string, format: uuid }, householdId: { type: string, format: uuid } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/jungles/{id}/members/{uid}:
    parameters: [{ $ref: "#/components/parameters/JungleID" }, { name: uid, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateMember
      summary: Update member
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [member, sitter] }, until: { type: string, format: date-time } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    delete:
      operationId: removeMember
      summary: Remove member
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /v1/sync/pull:
    get:
      operationId: pull
      summary: Pull
      parameters:
        - { name: since, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Changes after the cursor
          content:
            application/json:
              schema:
                type: object
                required: [changes, cursor, more]
                properties:
                  changes: { type: array, items: { $ref: "#/components/schemas/Record" } }
                  cursor: { type: integer, format: int64 }
                  more: { type: boolean }
  /v1/sync/push:
    post:
      operationId: push
      summary: Push
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [changes], properties: { changes: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/Change" } } } }
      responses:
        "200":
          description: Per-change result
          content: { application/json: { schema: { type: object, required: [results], properties: { results: { type: array, items: { $ref: "#/components/schemas/PushResult" } } } } } }
  /v1/media/{jungle}/{id}:
    parameters:
      - { name: jungle, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putMedia
      summary: Put media
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/heic: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses: { "201": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Error" } }
    get:
      operationId: getMedia
      summary: Get media
      responses:
        "200": { description: Image, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMedia
      summary: Delete media
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /v1/store/apple/transactions:
    post:
      operationId: postAppleTransaction
      summary: Post apple transaction
      description: Send Transaction.jwsRepresentation after purchase/restore. Purchases must set appAccountToken = userId.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [signedTransaction], properties: { signedTransaction: { type: string } } } } }
      responses: { "200": { $ref: "#/components/responses/Entitlements" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/store/play/purchases:
    post:
      operationId: postPlayPurchase
      summary: Post play purchase
      description: Send the purchase token. Purchases must set obfuscatedAccountId = userId.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [purchaseToken], properties: { purchaseToken: { type: string } } } } }
      responses: { "200": { $ref: "#/components/responses/Entitlements" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/diagnose/feedback:
    post:
      operationId: diagnoseFeedback
      summary: Rate a diagnosis (teaches the library)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ref, helped], properties: { ref: { type: string }, helped: { type: boolean } } } } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Error" } }
  /v1/diagnose:
    post:
      operationId: diagnose
      summary: Plant doctor (Plus) from a photo, with the whole scene and local weather
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/Extras" }, { type: object, required: [photo], properties: { photo: { type: string, format: byte }, species: { type: string }, note: { type: string }, lang: { type: string }, lat: { type: number }, lon: { type: number }, situation: { $ref: "#/components/schemas/Situation" } } } ] } } }
      responses: { "200": { description: Diagnosis, content: { application/json: { schema: { $ref: "#/components/schemas/Diagnosis" } } } }, "402": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /v1/brain/ask:
    post:
      operationId: brainAsk
      summary: Care question answered from our own knowledge, in any of our languages
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/Extras" }, { type: object, required: [q], properties: { q: { type: string }, lang: { type: string }, species: { type: string }, lat: { type: number }, lon: { type: number }, situation: { $ref: "#/components/schemas/Situation" } } } ] } } }
      responses:
        "200":
          description: Answers, best first. kind is symptom|pest|disease|deficiency|species|topic|glossary|soil|situation|weather; id is the knowledge id.
          content: { application/json: { schema: { type: object, properties: { answers: { type: array, items: { type: object, properties: { id: { type: string }, kind: { type: string }, title: { type: string }, text: { type: string }, steps: { type: array, items: { type: string } } } } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/brain/identify:
    post:
      operationId: brainIdentify
      summary: Name a plant from a photo with our own model, plus the photo's scene
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [photo], properties: { photo: { type: string, format: byte }, lang: { type: string }, scene: { type: boolean, default: true, description: "false skips the vision model (quick BioCLIP-only scene)" } } } } }
      responses:
        "200":
          description: Top 3 species and the scene
          content: { application/json: { schema: { type: object, properties: { candidates: { type: array, items: { type: object, properties: { id: { type: string }, scientific: { type: string }, name: { type: string }, score: { type: number } } } }, confident: { type: boolean }, source: { type: string, enum: [internal, free, claude] }, scene: { $ref: "#/components/schemas/Scene" } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/brain/scene:
    post:
      operationId: brainScene
      summary: The whole scene of a plant photo (plant, pot, soil, light, surroundings), own models only
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [photo], properties: { photo: { type: string, format: byte }, lang: { type: string } } } } }
      responses: { "200": { description: Scene, content: { application/json: { schema: { type: object, properties: { scene: { $ref: "#/components/schemas/Scene" } } } } } }, "400": { $ref: "#/components/responses/Error" } }
  /v1/brain/care-plan:
    post:
      operationId: brainCarePlan
      summary: Care plan for a species in its real conditions (medium, life stage, pot, scene, weather)
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [ { $ref: "#/components/schemas/Extras" }, { type: object, required: [species], properties: { species: { type: string }, lang: { type: string }, lat: { type: number }, lon: { type: number }, photo: { type: string, format: byte, description: "optional: the photo's scene joins the situation" }, situation: { $ref: "#/components/schemas/Situation" } } } ] } } }
      responses:
        "200":
          description: Care plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  species: { type: string }
                  medium: { $ref: "#/components/schemas/Medium" }
                  waterEveryDays: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
                  waterStyle: { type: string, enum: [top, half, dry, moist, refresh, reservoir, soak, mist, closed], description: "refresh = swap the water (water culture), reservoir = top up (LECA/PON), soak = sphagnum, mist = mounted, closed = terrarium; never show a soil 'water me' for these" }
                  mediumCare: { type: array, items: { type: string } }
                  light: { type: string }
                  humidityMin: { type: number }
                  tempRange: { type: array, items: { type: number } }
                  feedEveryWeeks: { type: number }
                  feed: { type: string }
                  mix: { type: string }
                  repotEveryYears: { type: number }
                  toxicCats: { type: boolean }
                  toxicDogs: { type: boolean }
                  tip: { type: string }
                  warnings: { type: array, items: { type: string } }
                  advice: { type: array, items: { type: string } }
                  adviceIds: { type: array, items: { type: string } }
                  weatherNotes: { type: array, items: { type: string } }
                  followUps: { type: array, items: { type: object, properties: { inDays: { type: integer }, repeatEveryDays: { type: integer }, times: { type: integer }, what: { type: string } } } }
                  situation: { $ref: "#/components/schemas/Situation" }
                  scene: { $ref: "#/components/schemas/Scene" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/brain/feedback:
    post:
      operationId: brainFeedback
      summary: Correct the brain (60 a day per user)
      description: "kind species: predicted/corrected species ids (corrected photos the owner shared via photoRef jungleId/mediaId feed the nightly reference index). scene_field: \"soil.medium=soil\" -> \"soil.medium=water\". answer_helpful / diagnose_helpful: predicted = id, corrected = yes|no."
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [species, scene_field, answer_helpful, diagnose_helpful] }, predicted: { type: string }, corrected: { type: string }, photoRef: { type: string }, lang: { type: string } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /v1/me/weather-watch:
    put:
      operationId: weatherWatch
      summary: Frost, heatwave and rain-skip alerts for this device
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [lat, lon, on, deviceId], properties: { lat: { type: number }, lon: { type: number }, lang: { type: string }, on: { type: boolean }, deviceId: { type: string, format: uuid } } } } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Error" } }
  /v1/me/digest:
    get:
      operationId: getDigest
      summary: This week's jungle digest (due, watch, grew, photos) across every jungle you can reach
      responses:
        "200": { description: Digest, content: { application/json: { schema: { $ref: "#/components/schemas/Digest" } } } }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: putDigest
      summary: Weekly digest push on or off for this device (default on). The push opens mytinyjungle://digest
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [on, deviceId], properties: { on: { type: boolean }, deviceId: { type: string, format: uuid }, lang: { type: string, description: "en, pt-BR, es, fr, de or ja; kept for the push text" } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/brain/identify-batch:
    post:
      operationId: brainIdentifyBatch
      summary: Name every plant in one photo of a shelf (each crop counts against the identify daily limit)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [photo], properties: { photo: { type: string, format: byte, description: "JPEG or PNG, base64, up to 1.8 MB encoded" }, lang: { type: string } } } } }
      responses:
        "200":
          description: One item per plant found
          content:
            application/json:
              schema:
                type: object
                required: [items, detector, charged, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BatchItem" } }
                  detector: { type: string, enum: [model, grid] }
                  charged: { type: integer, description: crops identified (quota used) }
                  truncated: { type: boolean, description: the daily limit stopped the batch early }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/brain/identify/feedback:
    post:
      operationId: identifyFeedback
      summary: "Owner's pick after identify: kept our top guess, chose another species, or none"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [suggested], properties: { suggested: { type: string, description: our top species id }, chosen: { type: string, description: species id the owner kept; empty when none } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, outcome: { type: string, enum: [confirmed, corrected, rejected] } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/households:
    get:
      operationId: households
      summary: Households you belong to
      responses:
        "200": { description: Households, content: { application/json: { schema: { type: object, required: [households], properties: { households: { type: array, items: { $ref: "#/components/schemas/Household" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createHousehold
      summary: Create a household on a jungle you own, or on a new shared jungle
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, maxLength: 60 }, jungleId: { type: string, format: uuid } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, required: [id, jungleId, name], properties: { id: { type: string, format: uuid }, jungleId: { type: string, format: uuid }, name: { type: string } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/households/{id}:
    delete:
      operationId: deleteHousehold
      summary: End the household (creator only; the jungle stays)
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/households/{id}/invites:
    post:
      operationId: createHouseholdInvite
      summary: Single-use invite code (7 days), owners only
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { role: { type: string, enum: [carer, owner], default: carer } } } } }
      responses:
        "201": { description: Invite, content: { application/json: { schema: { type: object, required: [code, url, expiresAt], properties: { code: { type: string }, url: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/household-invites/{code}/redeem:
    post:
      operationId: redeemHouseholdInvite
      summary: Join a household (and its jungle) by code
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Joined, content: { application/json: { schema: { type: object, required: [householdId, jungleId], properties: { householdId: { type: string, format: uuid }, jungleId: { type: string, format: uuid } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/households/{id}/members/{uid}:
    patch:
      operationId: updateHouseholdMember
      summary: Change a member's role (owners only; not the creator)
      parameters: [{ $ref: "#/components/parameters/JungleID" }, { name: uid, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [carer, owner] } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "404": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: removeHouseholdMember
      summary: Remove a member (owners) or leave (your own id); also leaves the jungle
      parameters: [{ $ref: "#/components/parameters/JungleID" }, { name: uid, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /v1/households/{id}/assignments:
    put:
      operationId: putAssignment
      summary: Pin a plant to a member (null clears), owners only
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [plantId], properties: { plantId: { type: string, format: uuid }, userId: { type: [string, "null"], format: uuid } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/households/{id}/rotation:
    get:
      operationId: householdRotation
      summary: Fair watering rotation for the next days
      parameters: [{ $ref: "#/components/parameters/JungleID" }, { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 28, default: 7 } }]
      responses:
        "200":
          description: Rotation
          content:
            application/json:
              schema:
                type: object
                required: [householdId, from, to, members, turns]
                properties:
                  householdId: { type: string, format: uuid }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  members:
                    type: array
                    items: { type: object, properties: { userId: { type: string, format: uuid }, displayName: { type: [string, "null"] }, role: { type: string }, waterings30d: { type: integer }, upcoming: { type: integer } } }
                  turns:
                    type: array
                    items: { type: object, properties: { plantId: { type: string }, plant: { type: string }, due: { type: string, format: date-time }, overdue: { type: boolean }, userId: { type: string, format: uuid }, assigned: { type: boolean } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/plants/{id}/passport:
    post:
      operationId: createPassport
      summary: Share a plant's public care card (same token on re-share; the card is refreshed)
      parameters: [{ $ref: "#/components/parameters/JungleID" }, { name: lang, in: query, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { notes: { type: string, maxLength: 600, description: "owner's care notes shown on the card" } } } } }
      responses:
        "200": { description: Shared, content: { application/json: { schema: { type: object, required: [token, url, card], properties: { token: { type: string }, url: { type: string, description: "https page, QR-able" }, card: { $ref: "#/components/schemas/PassportCard" } } } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePassport
      summary: Stop sharing (the link stops working)
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "401": { $ref: "#/components/responses/Error" } }
  /v1/passports/{token}:
    get:
      operationId: getPassport
      summary: Public care card (no sign-in)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }, { name: lang, in: query, schema: { type: string } }]
      responses:
        "200": { description: Card, content: { application/json: { schema: { $ref: "#/components/schemas/PassportCard" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/passports/{token}/import:
    post:
      operationId: importPassport
      summary: Add the shared plant to your jungle (personal by default)
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { jungleId: { type: string, format: uuid }, lang: { type: string } } } } }
      responses:
        "201": { description: Imported, content: { application/json: { schema: { type: object, required: [plantId, jungleId, version], properties: { plantId: { type: string, format: uuid }, jungleId: { type: string, format: uuid }, version: { type: integer, format: int64 } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /p/{token}:
    get:
      operationId: passportPage
      summary: Public passport page (HTML)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }, { name: lang, in: query, schema: { type: string } }]
      responses:
        "200": { description: Page, content: { text/html: { schema: { type: string } } } }
        "404": { description: Not shared }
  /v1/plants/{id}/supplies:
    get:
      operationId: plantSupplies
      summary: Soil mix, pot and fertiliser for this plant's species
      parameters: [{ $ref: "#/components/parameters/JungleID" }, { name: lang, in: query, schema: { type: string } }]
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                required: [plantId, species, soil, pot, fertiliser, items]
                properties:
                  plantId: { type: string }
                  species: { type: string }
                  soil: { type: object, properties: { code: { type: string }, name: { type: string }, recipe: { type: string } } }
                  pot: { type: object, properties: { material: { type: string, enum: [terracotta, plastic, orchid] }, name: { type: string }, diameterCm: { type: [integer, "null"] }, repotEveryYears: { type: number }, note: { type: string } } }
                  fertiliser: { type: object, properties: { code: { type: string }, name: { type: string }, everyWeeks: { type: number }, note: { type: string } } }
                  items:
                    type: array
                    items: { type: object, properties: { kind: { type: string, enum: [soil, pot, fertiliser] }, name: { type: string }, why: { type: string }, affiliate: { type: [string, "null"] }, have: { type: boolean } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/me/supplies:
    get:
      operationId: mySupplies
      summary: Your supplies stock
      responses:
        "200": { description: Supplies, content: { application/json: { schema: { type: object, required: [supplies], properties: { supplies: { type: array, items: { $ref: "#/components/schemas/Supply" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me/supplies/{id}:
    put:
      operationId: putSupply
      summary: Create or replace a supply (client-made uuid); at or under lowAt one push per drop
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind, name, qty], properties: { kind: { type: string, enum: [soil, fertiliser, pot, pesticide, other] }, name: { type: string, maxLength: 80 }, qty: { type: number, minimum: 0 }, unit: { type: string, maxLength: 16 }, lowAt: { type: [number, "null"], minimum: 0 } } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Supply" } } } }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSupply
      summary: Remove a supply
      parameters: [{ $ref: "#/components/parameters/JungleID" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "401": { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    JungleID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Ok: { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Tokens: { description: Tokens, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
    Entitlements:
      description: Current Plus status
      content: { application/json: { schema: { type: object, required: [plus, entitlements], properties: { plus: { type: boolean }, entitlements: { type: array, items: { $ref: "#/components/schemas/Entitlement" } } } } } }
  schemas:
    Situation: { type: object, additionalProperties: { type: array, items: { type: string } }, description: "Keys as in the knowledge base scenarios: room, humidity, temp, light, watered, event, season, weather, pot, soil, medium, moisture, surface, near, lifeStage, plant, water, home, treating" }
    Medium: { type: [string, "null"], enum: [soil, chunky, cactus, leca, pon, sphagnum, water, mounted, terrarium, ground, null] }
    Extras:
      type: object
      properties:
        medium: { $ref: "#/components/schemas/Medium" }
        lifeStage: { type: string, enum: [cutting, seedling, acclimating, repotted, dormant, flowering, recovering, unknown_history] }
        outdoor: { type: boolean }
        potSetup: { type: object, properties: { selfWatering: { type: boolean }, cachepot: { type: boolean }, drainage: { type: boolean }, material: { type: string }, sizeFit: { type: string, enum: [too_small, ok, too_big] } } }
        weather: { $ref: "#/components/schemas/WeatherFacts" }
    WeatherFacts:
      type: object
      description: Optional; when absent the server reads Open-Meteo near lat/lon (past 7 days, 16-day forecast, 1991-2020 monthly normals).
      properties:
        lat: { type: number }
        month: { type: integer }
        tempNow: { type: number }
        rhNow: { type: number }
        windNow: { type: number }
        cloudNow: { type: number }
        rainNow: { type: number }
        rain7: { type: number }
        max7: { type: number }
        min7: { type: number }
        rainToday: { type: number }
        rain16: { type: number }
        rainDays16: { type: integer }
        max16: { type: number }
        min16: { type: number }
        frostDays16: { type: integer }
        heatDays16: { type: integer }
        normalMax: { type: number }
        normalMin: { type: number }
        normalRain: { type: number }
        hasNormals: { type: boolean }
    SceneValue: { type: object, required: [value, conf], properties: { value: { description: "enum string, number, boolean, \"unknown\" or null" }, conf: { type: number, minimum: 0, maximum: 1 } } }
    SceneItem: { type: object, properties: { item: { type: string }, conf: { type: number } } }
    Scene:
      type: object
      properties:
        plant:
          type: object
          properties:
            heightCm: { $ref: "#/components/schemas/SceneValue" }
            leafCount: { $ref: "#/components/schemas/SceneValue" }
            stage: { $ref: "#/components/schemas/SceneValue", description: "seedling|juvenile|mature|unknown" }
            artificial: { $ref: "#/components/schemas/SceneValue", description: "boolean or unknown: a fake plant" }
            multiple: { $ref: "#/components/schemas/SceneValue", description: "boolean or unknown: several plants in one pot" }
            issues: { type: array, items: { type: object, properties: { kind: { type: string, enum: [yellowing, brown_tips, brown_spots, black_spots, pale, wilting, drooping, curling, crispy, mushy, holes, webbing, insects, white_powder, white_fluff, sticky, mold, leggy, sunburn, variegation_loss, rot] }, conf: { type: number }, where: { type: string, enum: [new_leaves, old_leaves, all_leaves, stem, soil, roots, flowers, unknown] } } } }
        pot:
          type: object
          properties:
            material: { $ref: "#/components/schemas/SceneValue", description: "plastic|terracotta|ceramic_glazed|glass|metal|basket_cachepot|nursery|self_watering|hanging|none|unknown" }
            drainage: { $ref: "#/components/schemas/SceneValue", description: "yes|no|unknown" }
            diameterCm: { $ref: "#/components/schemas/SceneValue" }
            rootbound: { $ref: "#/components/schemas/SceneValue" }
            cachepot: { $ref: "#/components/schemas/SceneValue" }
        soil:
          type: object
          properties:
            medium: { $ref: "#/components/schemas/SceneValue", description: "soil|chunky|cactus|leca|pon|sphagnum|water|mounted|terrarium|ground|unknown" }
            moisture: { $ref: "#/components/schemas/SceneValue", description: "dry|moist|wet|unknown" }
            surface: { type: array, items: { $ref: "#/components/schemas/SceneItem" }, description: "items: stones|pebbles|eggshells|bark|moss|perlite_top|sand|coffee_grounds|mold|salt_crust|fertilizer_pellets|dead_leaves|gnats|mulch" }
        light:
          type: object
          properties:
            source: { $ref: "#/components/schemas/SceneValue", description: "window|grow_light|lamp|mixed|outdoor|unknown" }
            naturalPct: { $ref: "#/components/schemas/SceneValue" }
            directSun: { $ref: "#/components/schemas/SceneValue" }
            windowDistance: { $ref: "#/components/schemas/SceneValue", description: "sill|under_1m|1_2m|over_2m|none_visible|unknown" }
            windowFacing: { $ref: "#/components/schemas/SceneValue", description: "n|ne|e|se|s|sw|w|nw|unknown" }
            intensity: { $ref: "#/components/schemas/SceneValue", description: "low|medium|bright_indirect|direct|unknown" }
            lux: { $ref: "#/components/schemas/SceneValue" }
            kelvin: { $ref: "#/components/schemas/SceneValue" }
        surroundings:
          type: object
          properties:
            room: { $ref: "#/components/schemas/SceneValue", description: "living|bedroom|bathroom|kitchen|office|balcony|outdoor|unknown" }
            near: { type: array, items: { $ref: "#/components/schemas/SceneItem" }, description: "items: heater|radiator|ac_vent|fireplace|tv|draft_door|curtain_sheer|other_plants|pet|aquarium" }
            humidityHint: { $ref: "#/components/schemas/SceneValue", description: "dry|normal|humid|unknown" }
    Diagnosis:
      type: object
      properties:
        problem: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        why: { type: string }
        steps: { type: array, items: { type: string } }
        urgent: { type: boolean }
        source: { type: string, enum: [library, internal, free, claude] }
        context: { type: string }
        ref: { type: string }
        ids: { type: array, items: { type: string }, description: "knowledge ids behind the answer, best first (up to 3)" }
        alternatives: { type: array, items: { type: string } }
        scene: { $ref: "#/components/schemas/Scene" }
        weather: { type: array, items: { type: string } }
    Error: { type: object, required: [error], properties: { error: { type: string } } }
    WeatherPattern:
      type: object
      required: [kind, from, to]
      properties:
        kind: { type: string, enum: [hot_dry_week, first_frost, heavy_rain] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    BatchItem:
      type: object
      required: [box, candidates, confident]
      properties:
        box: { type: object, description: fractions of the photo, properties: { x: { type: number }, y: { type: number }, w: { type: number }, h: { type: number } } }
        candidates: { type: array, items: { type: object, properties: { id: { type: string }, scientific: { type: string }, name: { type: string }, score: { type: number } } } }
        confident: { type: boolean }
    Household:
      type: object
      required: [id, jungleId, name, role, members, assignments]
      properties:
        id: { type: string, format: uuid }
        jungleId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, carer] }
        members: { type: array, items: { type: object, properties: { userId: { type: string, format: uuid }, displayName: { type: [string, "null"] }, role: { type: string, enum: [owner, carer] }, joinedAt: { type: string, format: date-time } } } }
        assignments: { type: array, items: { type: object, properties: { plantId: { type: string, format: uuid }, userId: { type: string, format: uuid } } } }
    PassportCard:
      type: object
      description: Species and care only; never names, photos, people or places
      properties:
        species: { type: object, properties: { id: { type: string }, scientific: { type: string }, name: { type: string }, family: { type: string } } }
        light: { type: string, enum: [low, medium, bright, direct] }
        waterEveryDays: { type: number }
        waterStyle: { type: string }
        humidityMin: { type: number }
        tempMin: { type: number }
        tempMax: { type: number }
        soil: { type: object, properties: { code: { type: string }, name: { type: string }, recipe: { type: string } } }
        substrate: { type: string }
        potMaterial: { type: string }
        potDiameterCm: { type: [number, "null"] }
        potHasDrainage: { type: [boolean, "null"] }
        outdoor: { type: boolean }
        feedEveryWeeks: { type: number }
        toxicCats: { type: boolean }
        toxicDogs: { type: boolean }
        tip: { type: string }
        notes: { type: string }
    Supply:
      type: object
      required: [id, kind, name, qty, unit, low, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [soil, fertiliser, pot, pesticide, other] }
        name: { type: string }
        qty: { type: number }
        unit: { type: string }
        lowAt: { type: [number, "null"] }
        low: { type: boolean }
        updatedAt: { type: string, format: date-time }
    Digest:
      type: object
      required: [week, due, watch, grew, photos]
      properties:
        week: { type: string, format: date, description: Monday of the current week (UTC) }
        due: { type: array, items: { $ref: "#/components/schemas/DigestItem" }, description: "kind water | feed | task, next 7 days and overdue" }
        watch: { type: array, items: { $ref: "#/components/schemas/DigestItem" }, description: "kind overdue_water | problem | quiet | repot" }
        grew: { type: array, items: { $ref: "#/components/schemas/DigestItem" }, description: "kind newLeaf | flower | measure | propagate, last 7 days" }
        photos: { type: array, items: { $ref: "#/components/schemas/DigestItem" }, description: "journal photos of the last 7 days (up to 12); media is the GET path" }
        next:
          type: object
          required: [week, due, weather]
          description: The week after this one
          properties:
            week: { type: string, format: date, description: Monday of next week }
            due: { type: array, items: { $ref: "#/components/schemas/DigestItem" }, description: "projected water and feed, and open tasks" }
            weather: { type: array, items: { $ref: "#/components/schemas/WeatherPattern" }, description: "multi-day patterns for your watched places, from now to the end of next week" }
    DigestItem:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        plantId: { type: string }
        plant: { type: string }
        date: { type: string, format: date-time }
        overdue: { type: boolean }
        title: { type: string }
        value: { type: number }
        eventId: { type: string }
        media: { type: string }
    House: { type: object, required: [data, version], properties: { data: { type: object }, version: { type: integer, format: int64 } } }
    Health: { type: object, required: [service, release, db], properties: { service: { type: string }, release: { type: string }, db: { type: boolean } } }
    Provider: { type: string, enum: [apple, google] }
    Platform: { type: string, enum: [ios, android, web] }
    SignInRequest:
      type: object
      required: [provider, idToken, deviceId, platform]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        idToken: { type: string }
        name: { type: string, maxLength: 60, description: Apple gives the name only on first sign-in. }
        deviceId: { type: string, format: uuid }
        platform: { $ref: "#/components/schemas/Platform" }
        model: { type: string, maxLength: 80 }
        appVersion: { type: string, maxLength: 40 }
    Tokens:
      type: object
      required: [userId, accessToken, refreshToken, expiresIn]
      properties:
        userId: { type: string, format: uuid }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
    Entitlement:
      type: object
      required: [store, productId, status]
      properties:
        store: { type: string, enum: [app_store, play] }
        productId: { type: string }
        expiresAt: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, grace, expired, revoked] }
    Device:
      type: object
      required: [id, platform, lastSeenAt, thisDevice]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: "#/components/schemas/Platform" }
        model: { type: [string, "null"] }
        appVersion: { type: [string, "null"] }
        lastSeenAt: { type: string, format: date-time }
        thisDevice: { type: boolean }
    Me:
      type: object
      required: [id, createdAt, providers, devices, plus, entitlements]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        locale: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        providers: { type: array, items: { $ref: "#/components/schemas/Provider" } }
        devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
        plus: { type: boolean }
        entitlements: { type: array, items: { $ref: "#/components/schemas/Entitlement" } }
    Member:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        role: { type: string, enum: [owner, member, sitter] }
        until: { type: [string, "null"], format: date-time }
    Jungle:
      type: object
      required: [id, name, isPersonal, ownerId, role, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isPersonal: { type: boolean }
        ownerId: { type: string, format: uuid }
        role: { type: string, enum: [owner, member, sitter] }
        until: { type: [string, "null"], format: date-time }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
    Invite:
      type: object
      required: [code, url, expiresAt]
      properties: { code: { type: string }, url: { type: string }, expiresAt: { type: string, format: date-time } }
    Entity: { type: string, enum: [plant, care_event, chat_message, owned_product, space, care_task, observation, badge, propagation] }
    Record:
      type: object
      required: [jungleId, entity, id, data, deleted, version, updatedAt]
      properties:
        jungleId: { type: string, format: uuid }
        entity: { $ref: "#/components/schemas/Entity" }
        id: { type: string, format: uuid }
        data: { type: object, additionalProperties: true }
        deleted: { type: boolean }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    Change:
      type: object
      required: [jungleId, entity, id, data, clientUpdatedAt]
      properties:
        jungleId: { type: string, format: uuid }
        entity: { $ref: "#/components/schemas/Entity" }
