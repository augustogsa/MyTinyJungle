# My Tiny Jungle API: Cloudflare (authenticated origin pulls) → Apache TLS → unix socket → mtj-api.
SSLVerifyClient require
SSLVerifyDepth 1
SSLCACertificateFile /etc/apache2/conf.d/userdata/cloudflare-origin-pull-ca.pem
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 100
RequestHeader set X-Forwarded-Proto "https"
ProxyPass /.well-known/ !
ProxyPass / unix:/run/mtj/api.sock|http://mtj-api/ nocanon retry=0
ProxyPassReverse / http://mtj-api/
AllowEncodedSlashes NoDecode
LimitRequestBody 13631488
ErrorDocument 503 "{\"error\":\"service_unavailable\"}"
Include /etc/apache2/conf.d/userdata/mdm-cloudflare-only.inc
