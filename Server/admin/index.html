<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Jungle Admin</title>
<style>
:root{--bg:#f6f5f0;--fg:#1d2a1f;--mut:#6b756c;--card:#fff;--line:#e3e2da;--acc:#2f6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#121512;--fg:#e8ece6;--mut:#98a198;--card:#1b201c;--line:#2a312b;--acc:#7fc48a}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}h1{font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.k b{display:block;font-size:24px}
.k span{color:var(--mut);font-size:13px}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--mut);font-weight:500}
input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;cursor:pointer}.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wrap{overflow-x:auto}#login{max-width:420px}
</style></head><body><main>
<h1>My Tiny Jungle · Admin</h1>
<section id="login" hidden><p>Paste an admin access token (<code>deno task admin-token</code> on the VPS).</p>
<div class="row"><input id="tok" placeholder="token" style="flex:1"><button onclick="save()">Sign in</button></div></section>
<section id="app" hidden>
<div class="grid" id="stats"></div>
<div class="row"><input id="q" placeholder="Search email or id"><button onclick="users()">Search</button>
<button onclick="localStorage.removeItem('mtjt');location.reload()" style="background:var(--mut)">Sign out</button></div>
<div class="wrap"><table><thead><tr><th>Email</th><th>Name</th><th>Platforms</th><th>Last seen</th><th>Joined</th></tr></thead><tbody id="users"></tbody></table></div>
</section></main>
<script>
const T=()=>{try{return localStorage.getItem('mtjt')}catch{return null}};
const api=async p=>{const r=await fetch('/v1/admin'+p,{headers:{authorization:'Bearer '+T()}});if(r.status==401||r.status==403){show(false);throw 0}return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d=s=>s?new Date(s).toLocaleString():'—';
function show(ok){login.hidden=ok;app.hidden=!ok}
function save(){try{localStorage.setItem('mtjt',tok.value.trim())}catch{}boot()}
async function users(){const u=await api('/users?q='+encodeURIComponent(q.value));
document.getElementById('users').innerHTML=u.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.display_name)}</td><td>${esc(x.platforms)}</td><td>${d(x.last_seen)}</td><td>${d(x.created_at)}</td></tr>`).join('')}
async function boot(){if(!T())return show(false);const s=await api('/stats');show(true);
const L={users:'Users',new_users_7d:'New (7d)',active_devices_24h:'Active devices 24h',ios_devices:'iOS devices',android_devices:'Android devices',shared_jungles:'Shared jungles',plants:'Plants',plus_active:'Plus active'};
stats.innerHTML=Object.entries(L).map(([k,l])=>`<div class="k"><b>${s[k]}</b><span>${l}</span></div>`).join('');users()}
boot();
</script></body></html>
